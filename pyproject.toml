[project]
name = "normalization-engine"
version = "0.1.0"
description = "Data Normalization & Standardization Engine for the Entity Resolution platform (upstream of Data Discovery and Splink)."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Proprietary" }

dependencies = [
    # --- core / contracts ---
    "pydantic>=2.9,<3",
    "blake3>=0.4,<1",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",

    # --- unicode / text ---
    "PyICU>=2.14,<3",
    "ftfy>=6.3,<7",
    "charset-normalizer>=3.4,<4",
    "anyascii>=0.3.2,<1",
    "regex>=2024.9.11",

    # --- names / phonetics ---
    "nameparser>=2.1.0,<3",  # LGPL — unmodified/dynamic-import only, see scripts/license_policy.toml
    "jellyfish>=1.1,<2",
    "phonetics>=1.0.5,<2",  # MIT; Double Metaphone (D11)

    # --- company ---
    # ponytail (audit finding #4 correction, 2026-10-21): declared KEEP although
    # never imported — `normexec.env_fingerprint` hashes this installed version
    # into env_id (FINGERPRINTED_PACKAGES); removing it records "MISSING" and
    # shifts env_id (ADR-014 identity contract). company.py strips suffixes via
    # the curated dictionary, not cleanco — the fingerprint role is the use.
    "cleanco>=2.3,<3",

    # --- phone / email ---
    "phonenumbers>=8.13,<9",
    "email-validator>=2.2,<3",

    # --- dates ---
    "dateparser>=1.4.2,<2",
    # ponytail (audit finding #4, user decision 2026-10-21): declared KEEP although
    # never imported — `normexec.env_fingerprint` hashes this installed version into
    # env_id (FINGERPRINTED_PACKAGES); removing it silently shifts env_id
    # (ADR-014 identity contract). Same for rapidfuzz below. Not dead weight;
    # fingerprint inputs.
    "python-dateutil>=2.9,<3",
    "ciso8601>=2.3,<3",

    # --- country / language / locale ---
    "pycountry>=24.6,<25",
    "Babel>=2.16,<3",
    "lingua-language-detector>=1.4,<2",

    # --- identifiers ---
    "python-stdnum>=1.20,<2",

    # --- numeric / currency / unit ---
    "Pint>=0.24,<1",

    # --- fuzzy (analysis only, never core normalization) ---
    # KEEP although never imported — env_id fingerprint input (see dates note above).
    "rapidfuzz>=3.10,<4",

    # --- address ---
    "google-i18n-address>=3,<4",
    "httpx>=0.27,<1",  # libpostal sidecar client

    # --- batch execution ---
    "polars>=1.9,<2",
    "duckdb>=1.1,<2",
    "pyarrow>=17.0,<18",

    # --- api ---
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.31,<1",
    "sqlalchemy>=2.0,<3",

    # --- connectors ---
    "psycopg[binary]>=3.2,<4",
    "pymysql>=1.1,<2",
    "pymongo>=4.9,<5",
    "clickhouse-connect>=0.8,<1",

    # --- workspace packages (editable) ---
    "normcore",
    "normalizers",
    "normdict",
    "normexec",
    "normio",
    "normanalysis",
    "normapi",
    "normcli",
]

[tool.uv.sources]
# PyICU has no official PyPI wheels for any platform (sdist only, requires
# system ICU + pkg-config at build time). On Windows there is no pkg-config/
# icu-config toolchain by default, so we pull cgohlke's prebuilt wheels
# directly (see docs/adr/ADR-001-unicode-strategy.md). On Linux/macOS the
# sdist builds fine once `libicu-dev`/`pkg-config` (or `icu4c`) are installed
# — see .github/workflows/ci-full.yml's apt-get step and README's dev setup.
pyicu = [
    { url = "https://github.com/cgohlke/pyicu-build/releases/download/v2.16.2/pyicu-2.16.2-cp312-cp312-win_amd64.whl", marker = "sys_platform == 'win32' and python_full_version >= '3.12' and python_full_version < '3.13'" },
    { url = "https://github.com/cgohlke/pyicu-build/releases/download/v2.16.2/pyicu-2.16.2-cp313-cp313-win_amd64.whl", marker = "sys_platform == 'win32' and python_full_version >= '3.13' and python_full_version < '3.14'" },
]
normcore = { workspace = true }
normalizers = { workspace = true }
normdict = { workspace = true }
normexec = { workspace = true }
normio = { workspace = true }
normanalysis = { workspace = true }
normapi = { workspace = true }
normcli = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5.0,<6",
    "pytest-asyncio>=0.24,<1",
    "pytest-benchmark>=4.0,<5",
    "hypothesis>=6.112,<7",
    "mypy>=1.11,<2",
    "ruff>=0.6,<1",
    "mutmut>=3.2,<4",
    "pip-audit>=2.7,<3",
    "playwright>=1.47,<2",
    "types-python-dateutil",
]

[tool.uv]
package = false # root is a virtual umbrella project — no source of its own, just aggregates workspace members

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages", "tests", "scripts", "spikes"]
# Generated from CLDR by scripts/generate_cldr_names.py (country,
# currency and language name tables). The formatter would re-indent 110k
# literal lines, and the generator would write them back flat on the next
# regeneration — permanent churn for files no human reads. Excluded from
# the formatter as well as the linter (the per-file-ignores below cover
# lint rules only).
extend-exclude = ["packages/normalizers/src/normalizers/_cldr_*_names.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
# spikes/ are throwaway M0 scripts proving risky integrations work (see
# docs/normalization-architecture.md §3) — not shipped gate deliverables.
# They intentionally print long explanatory lines and, for the confusables
# spike specifically, contain deliberate look-alike Unicode characters
# (Cyrillic 'а' substituted for Latin 'a') as the actual subject under test.
"spikes/*" = ["E501", "RUF001", "RUF002", "RUF003", "PLW0603"]
# scripts/env_fingerprint.py imports icu/phonenumbers lazily and optionally
# inside try/except ImportError blocks — these are capability probes, not
# structural imports, and must not fail the module at import time.
"scripts/env_fingerprint.py" = ["PLC0415"]
# tests/unit/test_env_fingerprint.py manipulates sys.path to import the
# scripts/ directory as a module before importing from it — the import must
# come after the path mutation.
"tests/unit/test_env_fingerprint.py" = ["PLC0415"]
# Generated from CLDR (scripts/generate_cldr_names.py). The "ambiguous"
# characters are real country, currency and language names in real
# scripts — that IS the data. Never hand-edited, so style rules buy
# nothing here.
"packages/normalizers/src/normalizers/_cldr_*_names.py" = ["RUF001", "RUF002", "RUF003", "E501"]
# tests/unit/test_locale_normalizers.py loads the generator by file path to
# assert the shipped map is still current; that import must follow the
# path construction.
"tests/unit/test_locale_normalizers.py" = ["PLC0415"]
# tests/unit/test_in_place_clone.py imports clone_executor inside the
# helper so monkeypatch can replace build_source_connector on the module
# object the function under test actually reads.
"tests/unit/test_in_place_clone.py" = ["PLC0415"]
# Every function in routes.py is a FastAPI handler whose signature is the
# framework's contract (path params, query params, Depends) — nothing in
# this codebase ever calls them positionally, so the positional-argument
# count is not a real readability signal here.
"packages/normapi/src/normapi/routes.py" = ["PLR0917"]
# The clone pipeline tests walk one end-to-end sequence each: DDL, then
# population, then the error report, then resume. The statement count IS
# the scenario; splitting them into smaller tests would break the ordering
# that is the thing under test.
"tests/integration/test_clone_pipeline.py" = ["PLR0915"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "packages/normcore/src:packages/normalizers/src:packages/normdict/src:packages/normexec/src:packages/normio/src:packages/normanalysis/src:packages/normapi/src:packages/normcli/src"
plugins = ["pydantic.mypy"]

# Third-party libraries with no type stubs / py.typed marker as of M0.
# Re-check at each milestone gate — several of these (phonenumbers,
# dateparser) have improved stub coverage over time; remove entries once
# upstream ships py.typed.
[[tool.mypy.overrides]]
module = [
    "pyarrow.*",
    "icu.*",
    "postal.*",
    "dateparser.*",
    "cleanco.*",
    "jellyfish.*",
    "phonetics.*",
    "nameparser.*",
    "stdnum.*",
    "ftfy.*",
    "anyascii.*",
    "charset_normalizer.*",
    "lingua.*",
    "i18naddress.*",
    "clickhouse_connect.*",
    "openpyxl.*",
    "pymysql.*",
    "regex.*",
]
ignore_missing_imports = true

[tool.mutmut]
# mutmut 3.x's real CLI (`mutmut run`) has no `--paths-to-mutate` flag —
# that name is the deprecated *config* key, not a CLI option, and passing
# it as one fails immediately with a FileNotFoundError (verified against
# the installed package's own click command definitions, not docs, during
# M8's real mutation-testing run). `source_paths` here is the real,
# current config key mutmut's own configuration.py reads from
# `[tool.mutmut]` in this file.
#
# `source_paths` MUST be exactly `["src"]`, not the real package
# locations (`packages/normcore/src`, ...) — mutmut derives each mutant's
# tracking key from the mutated file's path *relative to source_paths's
# parent*, with special-case handling to strip a literal leading `"src."`
# segment (mutmut/utils/format_utils.py's `get_mutant_name`), and
# separately verifies a hit's *real* Python `__module__` name against
# that key (mutmut/mutation/trampoline.py). Those two only agree when
# `source_paths` is the bare, single-segment `"src"` mutmut's own
# `setup_source_paths()` sys.path convention understands; a multi-segment
# path like `packages/normcore/src` produces keys like
# `packages.normcore.src.normcore.dispatch...` that can never match the
# real imported module name `normcore.dispatch`, and the whole run aborts
# with "tests recorded trampoline hits but none match any mutant key" —
# found by actually running `mutmut run` against this repo and reading
# its trampoline/key-generation source, not from its docs. The CI
# Dockerfile-equivalent build step bridges this by copying
# `packages/normcore/src/normcore` and `packages/normalizers/src/normalizers`
# to a top-level `src/` before running mutmut — see the mutation-testing
# CI job for the exact bridge commands.
source_paths = ["src"]
# mutmut's `mutants/` sandbox only copies `source_paths` + wherever the
# tests live by default — it does NOT copy the rest of the repo, so any
# test that reaches outside those (test_env_fingerprint.py needs
# scripts/env_fingerprint.py, test_normdict.py needs data/dictionaries,
# the traceability tests need Source.txt/docs/, test_no_llm_in_core.py
# scans the 5 real `packages/*/src` dirs directly) fails to import inside
# the sandbox with a plain `pytest -m unit` run, corrupting the WHOLE
# mutation run (mutmut aborts with 0 mutants evaluated rather than
# scoring only the reachable ones) — found by actually running `mutmut
# run` and inspecting its real `mutants/` sandbox contents, not from docs.
also_copy = [
    "scripts",
    "data",
    "docs",
    "conftest.py",
    "packages/normcore/src",
    "packages/normalizers/src",
    "packages/normexec/src",
    "packages/normdict/src",
    "packages/normanalysis/src",
]
# Restrict the per-mutant test run to the same fast, hermetic marks every
# other gate in this project uses as its "Layer 1 automated" check (see
# every M<n>-verification-pack.md's `pytest -m "unit or golden or
# property"`) — integration/e2e/bench-marked tests need live Docker
# services or a running dev server that mutmut's isolated `mutants/`
# sandbox has no way to provide, so running them per-mutant would just
# fail the baseline outright, not measure real mutation coverage.
pytest_add_cli_args = ["-m", "unit or golden or property"]

[tool.pytest.ini_options]
# L7: strict pytest — an unexpected pass or a mistyped marker must fail.
# User decision 2026-10-24: apply L7 now (supersedes the 2026-10-20
# "not yet met for prompt 4" deferral in AGENTS.md §4).
xfail_strict = true
addopts = "--strict-markers --strict-config"
markers = [
    "unit: fast isolated unit tests",
    "golden: golden/regression corpus tests",
    "property: hypothesis property tests (idempotency, determinism)",
    "contract: JSON Schema / Arrow schema conformance tests",
    "integration: requires docker compose services",
    "e2e: full end-to-end UI/API flows",
    "bench: performance benchmarks",
]
testpaths = ["tests"]
