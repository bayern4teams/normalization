# M22 — one-command startup. Reverse-proxies the real API (never mocked
# or duplicated here) and serves the built SPA. The app uses HashRouter
# (ui/src/App.tsx) — every client-side route lives after a `#`, which the
# browser never sends to the server — so the only path this server ever
# actually receives for a route is `/`; `try_files ... /index.html` below
# is a safety net for a direct deep-link hit, not the primary mechanism.
server {
    listen 80;
    server_name _;

    location /normalization/ {
        proxy_pass http://api:8080/normalization/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8080/health;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
