name: normalization

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: normalization
      POSTGRES_PASSWORD: normalization
      POSTGRES_DB: normalization
    ports:
      # 5433 deliberately avoided — commonly bound by other local dev stacks
      # (verified conflicting on this repo's dev machine during M0).
      - "5535:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U normalization -d normalization"]
      interval: 5s
      timeout: 3s
      retries: 10

  libpostal:
    build:
      context: ./services/libpostal
    ports:
      - "8081:8081"
    volumes:
      - libpostal_data:/data/libpostal
    environment:
      LIBPOSTAL_DATA_DIR: /data/libpostal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 3g

  api:
    build:
      context: .
      dockerfile: packages/normapi/Dockerfile
    ports:
      - "8080:8080"
    environment:
      NORM_PG_DSN: postgresql://normalization:normalization@postgres:5432/normalization
      NORM_LIBPOSTAL_URL: http://libpostal:8081
      NORM_SIDECAR_DUCKDB_PATH: /data/sidecar/catalog.duckdb
      NORM_SIDECAR_PARQUET_ROOT: /data/sidecar/parquet
      NORM_DICTIONARIES_DIR: /app/data/dictionaries
      # M15's connection registry (encrypted credentials, M13-M22 program)
      # needs a real 32-byte key to boot with any saved connection —
      # generate one with:
      #   uv run python -c "from normapi.secrets import generate_secret_key; print(generate_secret_key())"
      # and put it in a real (gitignored) .env — see .env.example. Left
      # unset the app still boots (no connections saved yet), but the
      # M21 Connect step will fail until this is real.
      NORM_SECRET_KEY: ${NORM_SECRET_KEY:-}
      # M17's persistent DuckDB cache tier is real and built, but its own
      # bench (M17 pack) measured it as a net loss at real ~8M-distinct-
      # value scale — deliberately left OFF (`:memory:`) here, not an
      # oversight.
      NORM_CACHE_PATH: ":memory:"
      # Optional legacy single-column path (M10, largely superseded by
      # M15/M21's Connect flow) — server-side JSON, never a client-
      # supplied DSN. Empty by default so a clean clone boots without
      # requiring a sources.json to exist. To use it: create sources.json
      # (see .env.example), set NORM_SOURCES_CONFIG_PATH in your .env,
      # and add a bind mount for it under this service's `volumes:`.
      # NOTE if you do: a `"host": "localhost"` entry in that file means
      # the *container's* localhost, not the Docker host's — point it at
      # `host.docker.internal` instead on Docker Desktop.
      NORM_SOURCES_CONFIG_PATH: ${NORM_SOURCES_CONFIG_PATH:-}
    volumes:
      - sidecar_data:/data/sidecar
    depends_on:
      postgres:
        condition: service_healthy
      libpostal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      # 8090, not 80/8080/5173/4173 — 8080 is already the api service's
      # own port, and 5173/4173 are the vite dev-server/preview ports
      # normapi's CORS allowlist (app.py's _DEFAULT_CORS_ORIGINS) already
      # names for `npm run dev`/`npm run preview` use, deliberately kept
      # distinct from this real containerized deployment's port.
      - "8090:80"
    depends_on:
      api:
        condition: service_healthy

  # --- demo read-only source containers (integration tests / spikes only) ---
  # Every one of these provisions a genuinely restricted `readonly_user` at
  # the database level (not just "our connector code has no write method")
  # via the init scripts under tests/integration/fixtures/ — see
  # docs/adr/ADR-013-normalization-storage.md and
  # tests/integration/test_readonly_connectors.py.
  demo-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: source_admin
      POSTGRES_PASSWORD: source_admin
      POSTGRES_DB: source_demo
    ports:
      - "5434:5432"
    volumes:
      - ./tests/integration/fixtures/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source_admin -d source_demo"]
      interval: 5s
      timeout: 3s
      retries: 10

  demo-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: source_admin
      MYSQL_DATABASE: source_demo
    ports:
      - "3307:3306"
    volumes:
      - ./tests/integration/fixtures/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  demo-mongo:
    image: mongo:7
    environment:
      # Root credentials are required to enable auth at all — without a
      # root user, MongoDB runs with NO authentication and every connection
      # (including one claiming to be "readonly_user") has full read/write
      # access regardless of role. This is why demo-mongo previously had no
      # meaningful read-only guarantee.
      MONGO_INITDB_ROOT_USERNAME: source_admin
      MONGO_INITDB_ROOT_PASSWORD: source_admin
    ports:
      - "27018:27017"
    volumes:
      - ./tests/integration/fixtures/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "source_admin",
          "-p",
          "source_admin",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  demo-clickhouse:
    image: clickhouse/clickhouse-server:24.9-alpine
    ports:
      - "8124:8123"
    volumes:
      - ./tests/integration/fixtures/clickhouse-init:/docker-entrypoint-initdb.d:ro
      - ./tests/integration/fixtures/clickhouse-init/users.xml:/etc/clickhouse-server/users.d/readonly_user.xml:ro
    healthcheck:
      # 127.0.0.1, not localhost: on this image's Alpine/musl resolver,
      # "localhost" resolves ::1 first and the IPv6 loopback listener does
      # not accept connections even with listen_host set to the wildcard —
      # confirmed empirically (M1) by testing both from inside the
      # container. 127.0.0.1 sidesteps the resolution ambiguity entirely.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  libpostal_data:
  sidecar_data:
