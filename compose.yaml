name: normalization

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: normalization
      POSTGRES_PASSWORD: normalization
      POSTGRES_DB: normalization
    ports:
      # 5433 deliberately avoided — commonly bound by other local dev stacks
      # (verified conflicting on this repo's dev machine during M0).
      - "5535:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U normalization -d normalization"]
      interval: 5s
      timeout: 3s
      retries: 10

  libpostal:
    build:
      context: ./services/libpostal
    ports:
      - "8081:8081"
    volumes:
      - libpostal_data:/data/libpostal
    environment:
      LIBPOSTAL_DATA_DIR: /data/libpostal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 3g

  api:
    build:
      context: .
      dockerfile: packages/normapi/Dockerfile
    ports:
      - "8080:8080"
    environment:
      NORM_PG_DSN: postgresql://normalization:normalization@postgres:5432/normalization
      NORM_LIBPOSTAL_URL: http://libpostal:8081
      NORM_SIDECAR_DUCKDB_PATH: /data/sidecar/catalog.duckdb
      NORM_SIDECAR_PARQUET_ROOT: /data/sidecar/parquet
      # §103's normalization cache (normapi/app.py's _DEFAULT_CACHE_PATH) —
      # was never set here, so the cache silently defaulted to ":memory:"
      # in every real deployment despite being real, tested,
      # persistence-capable code. /data/sidecar is already the sidecar_data
      # volume mounted below, so this needs no new volume, just this line.
      NORM_CACHE_PATH: /data/sidecar/cache.duckdb
      NORM_DICTIONARIES_DIR: /app/data/dictionaries
      # DB-clone-and-normalize feature (decision #12): encrypts saved
      # connection passwords at rest. Dev-only fixed key, same convention
      # as this file's plaintext POSTGRES_PASSWORD above — generate a real
      # one for any non-local deployment (`Fernet.generate_key()`).
      NORM_SECRET_KEY: 4tBi41i-Vq5DF6d-c4UTVHgIV_Kd-A3t_-mQd-uN_zE=
      # Backstop for store.py's own row-count cap (NORM_MAX_RUN_ROWS,
      # default 40_000 — see DEFAULT_MAX_RUN_ROWS's comment for the real
      # memory measurements this and the limit below are based on): if
      # something still finds a way past the cap, this limit makes the
      # container fail predictably instead of contending for host memory.
      # 4g, not 2g — live measurement showed 2g wasn't actually enough
      # headroom for a 50,000-row run despite an initial (wrong, unmeasured)
      # guess that it would be; this value IS measured (50K rows peaked at
      # ~3.4GB and completed cleanly under this limit).
    mem_limit: 4g
    volumes:
      - sidecar_data:/data/sidecar
    depends_on:
      postgres:
        condition: service_healthy
      libpostal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --- demo read-only source containers (integration tests / spikes only) ---
  # Every one of these provisions a genuinely restricted `readonly_user` at
  # the database level (not just "our connector code has no write method")
  # via the init scripts under tests/integration/fixtures/ — see
  # docs/adr/ADR-013-normalization-storage.md and
  # tests/integration/test_readonly_connectors.py.
  demo-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: source_admin
      POSTGRES_PASSWORD: source_admin
      POSTGRES_DB: source_demo
    ports:
      - "5434:5432"
    volumes:
      - ./tests/integration/fixtures/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U source_admin -d source_demo"]
      interval: 5s
      timeout: 3s
      retries: 10

  demo-mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: source_admin
      MYSQL_DATABASE: source_demo
    ports:
      - "3307:3306"
    volumes:
      - ./tests/integration/fixtures/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  demo-mongo:
    image: mongo:7
    environment:
      # Root credentials are required to enable auth at all — without a
      # root user, MongoDB runs with NO authentication and every connection
      # (including one claiming to be "readonly_user") has full read/write
      # access regardless of role. This is why demo-mongo previously had no
      # meaningful read-only guarantee.
      MONGO_INITDB_ROOT_USERNAME: source_admin
      MONGO_INITDB_ROOT_PASSWORD: source_admin
    ports:
      - "27018:27017"
    volumes:
      - ./tests/integration/fixtures/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "source_admin",
          "-p",
          "source_admin",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  demo-clickhouse:
    image: clickhouse/clickhouse-server:24.9-alpine
    ports:
      - "8124:8123"
    volumes:
      - ./tests/integration/fixtures/clickhouse-init:/docker-entrypoint-initdb.d:ro
      - ./tests/integration/fixtures/clickhouse-init/users.xml:/etc/clickhouse-server/users.d/readonly_user.xml:ro
    healthcheck:
      # 127.0.0.1, not localhost: on this image's Alpine/musl resolver,
      # "localhost" resolves ::1 first and the IPv6 loopback listener does
      # not accept connections even with listen_host set to the wildcard —
      # confirmed empirically (M1) by testing both from inside the
      # container. 127.0.0.1 sidesteps the resolution ambiguity entirely.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  libpostal_data:
  sidecar_data:
