name: release

# Fires on a version tag `vX.Y.Z` that equals the packages' version (owner,
# 2026-11-19, "4. a"). Publishes, all private (owner: "nothing should be
# public at all"): the API image to this repository's GHCR, and a GitHub
# Release holding the Python packages. The repository's source archive comes
# with every release. GitLab does the same in .gitlab-ci.yml (release stage).
#
# No image signing: keyless cosign writes every signature to the public
# Sigstore log, which the owner's rule forbids. The milestone sign-off gate
# that used to guard this workflow stays in gate.yml's milestone pipeline.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4

      - name: The tag must equal every package's version
        run: python3 scripts/check_release_version.py "${GITHUB_REF_NAME}"

      - name: Build the Python packages
        run: uv build --all-packages --out-dir dist

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: packages/normapi/Dockerfile
          push: true
          # `:latest` always points at the newest release (only ever pushed
          # from a vX.Y.Z tag, past the version check), so an app machine's
          # deploy/.env can pin `...api:latest` and update with one
          # `docker compose pull && up -d` instead of an .env edit per
          # release. Layer dedup (see the Dockerfile) keeps that pull small.
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/api:latest

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
          --notes "Image: ghcr.io/${GITHUB_REPOSITORY}/api:${GITHUB_REF_NAME}. Deploy: docs/DEPLOY.md."
