name: ci-fast

# Runs on every push. Target: under 3 minutes. Lint + types + unit + a
# small fast-golden subset only — the full golden/property/contract/
# integration suite runs in ci-full on PRs (see ci-full.yml).

on:
  push:
    branches-ignore:
      - "milestone/**" # milestone branches use the heavier gate.yml workflow

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install ICU dev headers (PyICU sdist build requirement on Linux)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libicu-dev pkg-config

      - name: Sync (no dev extras needed for lint/type/unit fast path)
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy (packages only — fast)
        run: uv run mypy packages

      - name: Unit tests + fast golden subset
        run: uv run pytest -m "unit or (golden and not slow)" -q --maxfail=1
