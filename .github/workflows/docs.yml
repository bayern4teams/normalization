name: docs

# J12: CI checks the docs — markdownlint, link check, Mermaid syntax, Vale.
# Scope (user decision 2026-10-20, "4. a"): Vale, markdownlint and Mermaid
# lint the five J1 files only (the older docs/** prose is not rewritten);
# the link check also covers every Markdown file under docs/ (offline).

on:
  # v1.0.0: this project merges locally and pushes, so doc checks must run on
  # pushes too — a PR-only trigger would go unnoticed on most changes.
  push:
    branches-ignore:
      - "milestone/**" # milestone branches use the heavier gate.yml workflow
    paths:
      - "README.md"
      - "ARCHITECTURE.md"
      - "TECHNICAL_IMPLEMENTATION.md"
      - "GLOSSARY.md"
      - "docs/**"
      - "AGENTS.md"
      - ".vale.ini"
      - ".vale/**"
      - ".markdownlint-cli2.jsonc"
      - "scripts/check_mermaid.py"
      - "puppeteer-config.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "README.md"
      - "ARCHITECTURE.md"
      - "TECHNICAL_IMPLEMENTATION.md"
      - "GLOSSARY.md"
      - "docs/**"
      - "AGENTS.md"
      - ".vale.ini"
      - ".vale/**"
      - ".markdownlint-cli2.jsonc"
      - "scripts/check_mermaid.py"
      - "puppeteer-config.json"
      - ".github/workflows/docs.yml"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Vale (official binary, pinned)
        run: |
          curl -sSL -o vale.tar.gz https://github.com/errata-ai/vale/releases/download/v3.24.0/vale_3.24.0_Linux_64-bit.tar.gz
          curl -sSL -o vale_checksums.txt https://github.com/errata-ai/vale/releases/download/v3.24.0/vale_3.24.0_checksums.txt
          grep 'vale_3.24.0_Linux_64-bit.tar.gz$' vale_checksums.txt | sed 's|vale_3.24.0_Linux_64-bit.tar.gz|vale.tar.gz|' | sha256sum -c -
          tar xzf vale.tar.gz vale
          sudo install vale /usr/local/bin/vale
          vale --version

      - name: Sync style packages (Google)
        run: vale sync

      - name: Vale (simple English, J5 — errors gate, suggestions advisory)
        run: |
          files=$(for f in README.md ARCHITECTURE.md TECHNICAL_IMPLEMENTATION.md GLOSSARY.md docs/LESSONS.md AGENTS.md; do [ -f "$f" ] && echo "$f"; done)
          [ -z "$files" ] && echo "no J1 files present" && exit 0
          read -ra list <<< "$files"
          vale --minAlertLevel=error --output=line "${list[@]}"

  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
      - name: markdownlint-cli2 (pinned; config .markdownlint-cli2.jsonc)
        run: npx -y markdownlint-cli2@0.23.3

  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install lychee (official binary, pinned)
        run: |
          curl -sSL -o lychee.tar.gz https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-musl.tar.gz
          curl -sSL -o lychee.tar.gz.sha256 https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-musl.tar.gz.sha256
          echo "$(awk '{print $1}' lychee.tar.gz.sha256)  lychee.tar.gz" | sha256sum -c -
          tar xzf lychee.tar.gz
          sudo install lychee-x86_64-unknown-linux-musl/lychee /usr/local/bin/lychee
          lychee --version
      - name: Link check
        run: |
          files=$(for f in README.md ARCHITECTURE.md TECHNICAL_IMPLEMENTATION.md GLOSSARY.md docs/LESSONS.md AGENTS.md; do [ -f "$f" ] && echo "$f"; done)
          [ -z "$files" ] && echo "no J1 files present" && exit 0
          # lychee 0.24 skips mailto unless --include-mail is passed.
          read -ra list <<< "$files"
          lychee --no-progress "${list[@]}"
          # Local links under docs/ (older documents): offline, so a flaky
          # external site cannot fail a run.
          lychee --no-progress --offline 'docs/**/*.md'

  mermaid:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
      - name: Render every Mermaid block (fails on an invalid block)
        # System python3 is enough: scripts/check_mermaid.py is stdlib only.
        run: python3 scripts/check_mermaid.py
