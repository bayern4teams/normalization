name: dep-check

# M4/K4: deptry, blocking. Imports are declared in the workspace member that
# imports them; each member is scanned against its own pyproject, then the
# root (scripts/run_deptry.sh). Also: every [tool.mutmut].also_copy path exists.
# Deliberately NOT in ci-fast's four-command list (AGENTS.md section 5).

on:
  push:
    branches-ignore:
      - "milestone/**" # milestone branches use the heavier gate.yml workflow
  pull_request:

concurrency:
  group: dep-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install ICU dev headers (PyICU sdist build requirement on Linux)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libicu-dev pkg-config

      - name: Sync
        run: uv sync --all-extras

      - name: "deptry per member + root (M4)"
        run: scripts/run_deptry.sh

      - name: "mutmut also_copy paths exist"
        run: uv run python scripts/check_mutmut_paths.py
