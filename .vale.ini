# Vale prose linter — https://vale.sh
# StylesPath holds the vocabulary (config/, committed) and the style
# packages that `vale sync` downloads from Packages= below (git-ignored;
# CI runs `vale sync`). Vocab terms will come from GLOSSARY.md (prompt 2
# fills it).
StylesPath = .vale/styles
MinAlertLevel = suggestion

# Project vocabulary — accepted project terms (J5). Path per current Vale
# docs: <StylesPath>/config/vocabularies/<name>/accept.txt.
Vocab = Project

# Built-in Vale rules (spelling, repetitive wording) + Google's
# simple-English guidance (active voice, no jargon, one term per concept
# — the same ground J5 covers, machine-checked).
Packages = Google

[*.md]
BasedOnStyles = Vale, Google

# The agent/tooling files carry literal command lines and identifiers;
# Google's length rules flag them as prose noise, so they lint at
# Vale-core rules only.
[AGENTS.md]
BasedOnStyles = Vale
