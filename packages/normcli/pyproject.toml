[project]
name = "normcli"
version = "0.1.2"
description = "normalization-engine :: normcli"
requires-python = ">=3.12,<3.14"
dependencies = ["normanalysis"]

[tool.uv.sources]
normanalysis = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normcli"]
