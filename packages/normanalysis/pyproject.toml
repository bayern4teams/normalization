[project]
name = "normanalysis"
version = "0.1.1"
description = "normalization-engine :: normanalysis"
requires-python = ">=3.12,<3.14"
dependencies = [
    "normcore",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "pydantic>=2.9,<3",
    "phonenumbers>=8.13,<9",
    "pycountry>=24.6,<25",
    "Babel>=2.16,<3",
]

[tool.uv.sources]
normcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normanalysis"]

[tool.deptry.per_rule_ignores]
# C5: reason=lazy in-function imports of packages that depend on normanalysis; declaring them would make a dependency cycle (normapi -> normanalysis); approved=user 2026-10-24 (decision 8); review=2027-10-24
DEP003 = ["normalizers", "normapi", "normdict"]
