[project]
name = "normanalysis"
version = "0.1.0"
description = "normalization-engine :: normanalysis"
requires-python = ">=3.12,<3.14"
dependencies = [
    "normcore",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
]

[tool.uv.sources]
normcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normanalysis"]
