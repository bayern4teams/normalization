[project]
name = "normapi"
version = "0.1.0"
description = "normalization-engine :: normapi"
requires-python = ">=3.12,<3.14"
dependencies = [
    "normcore",
    "normdict",
    "normalizers",
    "normanalysis",
    "normexec",
    "normio",
    "normsink",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.31,<1",
    "psycopg[binary]>=3.2,<4",
    "cryptography>=43,<44",
    "blake3>=0.4,<1",
]

[tool.uv.sources]
normcore = { workspace = true }
normdict = { workspace = true }
normalizers = { workspace = true }
normanalysis = { workspace = true }
normexec = { workspace = true }
normio = { workspace = true }
normsink = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normapi"]
