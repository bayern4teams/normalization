[project]
name = "normapi"
version = "0.1.0"
description = "normalization-engine :: normapi"
requires-python = ">=3.12,<3.14"
dependencies = [
    "normcore",
    "normdict",
    "normalizers",
    "normanalysis",
    "normexec",
    "normio",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.31,<1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "cryptography>=42,<44",
    "blake3>=0.4,<1",
    "pydantic>=2.9,<3",
    "PyICU>=2.14,<3",
]

[tool.uv.sources]
normcore = { workspace = true }
normdict = { workspace = true }
normalizers = { workspace = true }
normanalysis = { workspace = true }
normexec = { workspace = true }
normio = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normapi"]

[tool.deptry.per_rule_ignores]
# C5: reason=see each comment; approved=user 2026-10-24 (decision 8); review=2027-10-24
DEP002 = [
    "psycopg",  # DSN driver: postgresql+psycopg:// scheme, loaded by SQLAlchemy
]
