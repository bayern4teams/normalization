[project]
name = "normsink"
version = "0.1.0"
description = "normalization-engine :: normsink"
requires-python = ">=3.12,<3.14"
dependencies = [
    "normcore",
    "normio",
    "pyarrow>=17.0,<18",
    "clickhouse-connect>=0.8,<1",
]

[tool.uv.sources]
normcore = { workspace = true }
normio = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normsink"]
