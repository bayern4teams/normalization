[project]
name = "normexec"
version = "0.1.4"
description = "normalization-engine :: normexec"
requires-python = ">=3.12,<3.14"
dependencies = [
    "normcore",
    "polars>=1.9,<2",
    "duckdb>=1.1,<2",
    "pyarrow>=17.0,<18",
    "blake3>=0.4,<1",
    "PyICU>=2.14,<3",
    "phonenumbers>=8.13,<9",
]

[tool.uv.sources]
normcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normexec"]
