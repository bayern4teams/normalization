[project]
name = "normexec"
version = "0.1.0"
description = "normalization-engine :: normexec"
requires-python = ">=3.12,<3.14"
dependencies = [
    "normcore",
    "normio",
    "normsink",
    "polars>=1.9,<2",
    "duckdb>=1.1,<2",
    "pyarrow>=17.0,<18",
    "blake3>=0.4,<1",
    "psutil>=6.0,<7",
]

[tool.uv.sources]
normcore = { workspace = true }
normio = { workspace = true }
normsink = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normexec"]
