[project]
name = "normdict"
version = "0.1.1"
description = "normalization-engine :: normdict"
requires-python = ">=3.12,<3.14"
dependencies = ["blake3>=0.4,<1", "pydantic>=2.9,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normdict"]
