[project]
name = "normio"
version = "0.1.4"
description = "normalization-engine :: normio"
requires-python = ">=3.12,<3.14"
dependencies = [
    "normcore",
    "pyarrow>=17.0,<18",
    "duckdb>=1.1,<2",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "pymysql>=1.1,<2",
    "pymongo>=4.9,<5",
    "clickhouse-connect>=0.8,<1",
    "openpyxl>=3.1,<4",
]

[tool.uv.sources]
normcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normio"]

[tool.deptry.per_rule_ignores]
# C5: reason=see each comment; approved=user 2026-10-24 (decision 8); review=2027-10-24
DEP002 = [
    "psycopg",  # DSN driver: postgresql+psycopg:// scheme, loaded by SQLAlchemy
    "pymysql",  # DSN driver: mysql+pymysql:// scheme, loaded by SQLAlchemy
    "normcore",  # workspace dep kept for the install graph; not imported (finding, not changed here)
]
