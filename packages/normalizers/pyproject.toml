[project]
name = "normalizers"
version = "0.1.0"
description = "normalization-engine :: normalizers"
requires-python = ">=3.12,<3.14"
dependencies = [
    "normcore",
    "normdict",
    "pyarrow>=17.0,<18",
    "PyICU>=2.14,<3",
    "ftfy>=6.3,<7",
    "charset-normalizer>=3.4,<4",
    "anyascii>=0.3.2,<1",
    "regex>=2024.9.11",
    "nameparser>=2.1.0,<3",
    "jellyfish>=1.1,<2",
    "cleanco>=2.3,<3",
    "phonenumbers>=8.13,<9",
    "email-validator>=2.2,<3",
    "httpx>=0.27,<1",
    "google-i18n-address>=3,<4",
    "dateparser>=1.4.2,<2",
    "python-dateutil>=2.9,<3",
    "ciso8601>=2.3,<3",
    "pycountry>=24.6,<25",
    "Babel>=2.16,<3",
    "lingua-language-detector>=1.4,<2",
]

[tool.uv.sources]
normcore = { workspace = true }
normdict = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normalizers"]
