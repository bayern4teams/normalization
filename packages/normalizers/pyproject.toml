[project]
name = "normalizers"
version = "0.1.0"
description = "normalization-engine :: normalizers"
requires-python = ">=3.12,<3.14"
dependencies = ["normcore", "pyarrow>=17.0,<18"]

[tool.uv.sources]
normcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/normalizers"]
